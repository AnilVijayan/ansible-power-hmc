---
# Tftp boot directory path in PXE server
pmc_pao_install_base_dir: /var/lib/tftpboot/

# Append base directory path with a new directory named by mac address
pmc_pao_install_dest_dir: "/var/lib/tftpboot/{{ pmc_pao_install_mac_address | default('') }}"

# Set core elf file path in PXE server
pmc_pao_install_core_file_path: "{{ pmc_pao_install_mac_address | default('') }}/boot/grub/powerpc-ieee1275/core.elf"

# HMC credentials (taken from the first host of the [hmcs] inventory group)
pmc_pao_install_curr_hmc_auth:
  username: "{{ hostvars[groups['hmcs'][0]].ansible_user }}"
  password: "{{ hostvars[groups['hmcs'][0]].ansible_password }}"
